<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selección de Nivel 🎮</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: white; font-family: 'Courier New', monospace; text-align: center; }
        .title-arcade { font-size: 3rem; color: #f39c12; text-shadow: 0 0 15px #e67e22, 0 0 30px #d35400; margin: 40px 0; font-weight: bold; }
        
        .grid-select { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .char-card { background-color: #16213e; border: 4px solid #0f3460; border-radius: 15px; padding: 20px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-decoration: none; color: white; display: block; }
        .char-card:hover { transform: scale(1.1); border-color: #e94560; box-shadow: 0 0 25px rgba(233, 69, 96, 0.6); z-index: 10; color: white; }
        
        .locked { filter: grayscale(100%); opacity: 0.5; border-color: #555; pointer-events: none; }
        .locked-icon { font-size: 3rem; margin-bottom: 10px; color: #777; }
        
        .emoji-big { font-size: 4rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1 class="title-arcade">¡SELECCIONA TU MUNDO!</h1>
    
    <div class="grid-select">
        <!-- Nivel 1: Conejitos -->
        <a href="/matrices" class="char-card" style="border-color: #ce93d8;">
            <div class="emoji-big">🎩🐰</div>
            <h3 style="color: #ce93d8;">Mundo 1</h3>
            <p>Matrices y Vectores</p>
        </a>

        <!-- Nivel 2: Ajolotes -->
        <a href="/sistemas" class="char-card" style="border-color: #4dd0e1;">
            <div class="emoji-big">🫧🦎</div>
            <h3 style="color: #4dd0e1;">Mundo 2</h3>
            <p>Sistemas Numéricos</p>
        </a>

        <!-- Nivel Bloqueado 1 -->
        <div class="char-card locked">
            <div class="locked-icon">🔒</div>
            <h3>Mundo 3</h3>
            <p>Próximamente...</p>
        </div>

        <!-- Nivel Bloqueado 2 -->
        <div class="char-card locked">
            <div class="locked-icon">🔒</div>
            <h3>Mundo 4</h3>
            <p>Secreto</p>
        </div>
    </div>
</body>
</html>
