<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Álgebra Lineal - Selección de Nivel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .banner-fia { background-color: #ffffff; padding: 10px 0; border-bottom: 2px solid #0f3460; text-align: center; }
        .banner-fia img { max-height: 55px; width: auto; }
        
        .info-card { background-color: #ffffff; color: #333333; border-radius: 15px; padding: 25px; margin-top: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .logo-uam { max-width: 130px; height: auto; margin-bottom: 15px; }
        
        .arcade-container { background-color: #16213e; border-radius: 15px; padding: 30px; margin-top: 25px; border: 2px solid #0f3460; }
        .title-arcade { font-family: 'Courier New', monospace; font-size: 2rem; color: #f39c12; text-shadow: 0 0 10px #e67e22; font-weight: bold; }
        
        .grid-select { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 800px; margin: 25px auto 0 auto; }
        .char-card { background-color: #0f3460; border: 3px solid #1f4068; border-radius: 12px; padding: 20px; text-decoration: none; color: white; transition: all 0.3s ease; text-align: center; }
        .char-card:hover { transform: translateY(-5px); border-color: #e94560; box-shadow: 0 0 15px rgba(233, 69, 96, 0.5); color: white; }
        .emoji-big { font-size: 3.5rem; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- BANNER SUPERIOR GENERAL -->
    <div class="banner-fia shadow-sm">
        <img src="{{ url_for('static', filename='fia.png') }}" alt="Facultad de Ingeniería y Arquitectura" class="img-fluid">
    </div>

    <div class="container my-4" style="max-width: 850px;">
        
        <!-- ENCABEZADO INSTITUCIONAL -->
        <div class="info-card text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Universidad Americana" class="logo-uam d-block mx-auto">
            <h3 style="color: #005a9c; font-weight: bold;" class="mb-1">Universidad Americana</h3>
            <h5 class="text-secondary fw-bold mb-3">Facultad de Ingeniería y Arquitectura</h5>
            
            <hr class="my-3">

            <div class="row text-start justify-content-center">
                <div class="col-md-8">
                    <p class="mb-1 fs-6"><strong>Autores:</strong></p>
                    <ul class="mb-3 ps-3 fw-semibold text-dark">
                        <li>Gabriel Omar Carrillo Picado</li>
                        <li>Moises Abraham Moraga</li>
                    </ul>
                    <p class="mb-0 fs-6"><strong>Docente:</strong> Carlos Iván Argüello Martínez</p>
                </div>
            </div>
        </div>

        <!-- SECCIÓN DE SELECCIÓN DE MUNDOS -->
        <div class="arcade-container text-center">
            <h2 class="title-arcade">¡SELECCIONA TU MUNDO!</h2>
            <div class="grid-select">
                <a href="/matrices" class="char-card" style="border-color: #ce93d8;">
                    <div class="emoji-big">🎩🐰</div>
                    <h4 style="color: #ce93d8;">Mundo 1</h4>
                    <p class="mb-0 text-white-50">Matrices y Vectores</p>
                </a>

                <a href="/sistemas" class="char-card" style="border-color: #4dd0e1;">
                    <div class="emoji-big">🫧🦎</div>
                    <h4 style="color: #4dd0e1;">Mundo 2</h4>
                    <p class="mb-0 text-white-50">Sistemas Numéricos</p>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
